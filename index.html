<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow · 任务清单</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1 class="app__title">TaskFlow</h1>
      <p class="app__subtitle">轻量任务清单 · 记录今天要做的事</p>
    </header>

    <section class="composer">
      <input
        id="task-input"
        class="composer__input"
        type="text"
        maxlength="60"
        placeholder="输入任务后按回车添加…"
        autocomplete="off"
      />
      <button id="add-btn" class="composer__btn" type="button">添加</button>
    </section>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty-state" class="empty-state">还没有任务，先添加一条吧</p>
  </main>

  <script src="assets/js/app.js"></script>
</body>
</html>
